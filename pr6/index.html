<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СпортМагазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">SPORT-MASTER</div>
        <div class="cart-icon-container" onclick="openCart()">
            <span class="cart-icon">🛒</span>
            <span id="cart-counter" class="cart-badge">0</span>
        </div>
    </header>

    <div class="container">
        <section id="catalog-page">
            <h1>Каталог товарів</h1>
            <div id="products-grid" class="products-grid">
                </div>
        </section>

        <section id="cart-page" class="hidden">
            <h1>Ваша корзина</h1>
            
            <div id="cart-items-container">
                </div>

            <div class="cart-actions">
                <button class="btn-secondary" onclick="showCatalog()">← Повернутись до покупок</button>
                <button class="btn-primary" onclick="alert('Перехід до оплати...')">Оплатити</button>
            </div>
        </section>
    </div>

    <div id="modal-empty" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-empty')">&times;</span>
            <p>Корзина пуста 😔</p>
            <button onclick="closeModal('modal-empty')">OK</button>
        </div>
    </div>

    <div id="modal-quantity" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-quantity')">&times;</span>
            <p>Вкажіть кількість:</p>
            <input type="number" id="qty-input" value="1" min="1" max="10">
            <button class="btn-primary" onclick="confirmAddToCart()">Додати у корзину</button>
        </div>
    </div>

    <div id="modal-success" class="modal hidden">
        <div class="modal-content">
            <p>✅ Товар додано</p>
            <div class="modal-buttons">
                <button class="btn-primary" onclick="goToCartFromModal()">Перейти у корзину</button>
                <button class="btn-secondary" onclick="closeModal('modal-success')">Повернутись до покупок</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
